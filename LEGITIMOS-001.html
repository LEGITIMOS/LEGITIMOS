<style>
/* Layout: central de ferramentas. Cabeçalho fixo com busca e abas, grade de cartões de vidro sobre fundo preto fosco com brilho vermelho. */
:root {
  --bg: #0a090a;
  --bg-glow: rgba(255, 32, 56, 0.16);
  --surface: rgba(255, 255, 255, 0.045);
  --surface-hi: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.1);
  --fg: #f4efef;
  --muted: #a1969a;
  --red: #ff2a3d;
  --red-ink: #ff6672;
  --red-soft: rgba(255, 42, 61, 0.14);
  --on-red: #ffffff;
  --glow: 0 0 0 1px rgba(255, 42, 61, 0.55), 0 0 22px rgba(255, 42, 61, 0.28);
  --font-display: "Chakra Petch", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f7f3f3;
    --bg-glow: rgba(212, 20, 42, 0.09);
    --surface: rgba(255, 255, 255, 0.78);
    --surface-hi: #ffffff;
    --line: rgba(30, 10, 14, 0.13);
    --fg: #1b1316;
    --muted: #6d6165;
    --red: #d4142a;
    --red-ink: #c0111f;
    --red-soft: rgba(212, 20, 42, 0.1);
    --glow: 0 0 0 1px rgba(212, 20, 42, 0.5), 0 6px 18px rgba(212, 20, 42, 0.16);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f7f3f3;
  --bg-glow: rgba(212, 20, 42, 0.09);
  --surface: rgba(255, 255, 255, 0.78);
  --surface-hi: #ffffff;
  --line: rgba(30, 10, 14, 0.13);
  --fg: #1b1316;
  --muted: #6d6165;
  --red: #d4142a;
  --red-ink: #c0111f;
  --red-soft: rgba(212, 20, 42, 0.1);
  --glow: 0 0 0 1px rgba(212, 20, 42, 0.5), 0 6px 18px rgba(212, 20, 42, 0.16);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg);
  background-image: radial-gradient(60rem 28rem at 50% -8rem, var(--bg-glow), transparent 70%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 0 4rem;
  min-height: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.wrap { width: 100%; max-width: 74rem; margin-inline: auto; padding-inline: 16px; }

/* Header */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.top-row { display: flex; align-items: center; gap: 1rem; padding-block: 0.85rem 0.6rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 0.7rem; margin-right: auto; }
.mark {
  width: 2.2rem; height: 2.2rem; border-radius: 0.55rem;
  display: grid; place-items: center;
  background: var(--red); color: var(--on-red);
  font-family: var(--font-display); font-weight: 700; font-size: 1.25rem;
  box-shadow: var(--glow);
}
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; letter-spacing: 0.14em; line-height: 1; }
.brand-name small {
  font-family: var(--font-mono); font-weight: 500; font-size: 0.62rem; letter-spacing: 0.18em;
  color: var(--red-ink); border: 1px solid var(--red); border-radius: 999px; padding: 0.12rem 0.45rem; margin-left: 0.4rem; vertical-align: 0.15rem;
}
.logo { width: 2.9rem; height: 2.9rem; border-radius: 50%; object-fit: cover; display: block; background: #000; box-shadow: var(--glow); }
.hero { display: flex; align-items: center; gap: 1.1rem; min-width: 0; }
.hero-logo { width: 7rem; height: 7rem; flex: 0 0 auto; border-radius: 50%; object-fit: cover; background: #000; box-shadow: var(--glow); }
@media (max-width: 520px) { .hero-logo { width: 4.6rem; height: 4.6rem; } }
.search { position: relative; flex: 1 1 22rem; max-width: 34rem; min-width: 0; }
.search svg { position: absolute; left: 0.85rem; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; min-width: 0; height: 2.7rem; padding: 0 2.6rem 0 2.6rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 0.7rem;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--red); box-shadow: var(--glow); }
.search .clear {
  position: absolute; right: 0.4rem; top: 50%; translate: 0 -50%;
  width: 1.9rem; height: 1.9rem; border: 0; border-radius: 0.5rem; background: transparent; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1;
}
.search .clear:hover { color: var(--fg); background: var(--surface-hi); }

.tabs { display: flex; gap: 0.25rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 0.55rem; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 0.45rem;
  height: 2.3rem; padding: 0 0.95rem; border-radius: 0.6rem; border: 1px solid transparent;
  background: transparent; color: var(--muted); cursor: pointer;
  font-family: var(--font-display); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.82rem;
}
.tab:hover { color: var(--fg); background: var(--surface); }
.tab[aria-selected="true"] { color: var(--fg); background: var(--red-soft); border-color: var(--red); box-shadow: var(--glow); }
.count {
  font-family: var(--font-mono); font-size: 0.7rem; min-width: 1.35rem; height: 1.35rem; padding: 0 0.3rem;
  display: inline-grid; place-items: center; border-radius: 999px; background: var(--red); color: var(--on-red);
}

/* Sections */
main { padding-top: 1.4rem; }
.head { display: flex; align-items: end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
h1, h2 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 4.4vw, 2.5rem); line-height: 1.08; letter-spacing: 0.02em; }
h1 em { font-style: normal; color: var(--red-ink); }
h2 { font-size: 1.15rem; letter-spacing: 0.06em; text-transform: uppercase; }
.sub { color: var(--muted); margin: 0.4rem 0 0; max-width: 40rem; }
.meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 1.2rem; }
.chip {
  height: 2rem; padding: 0 0.85rem; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted); cursor: pointer; font-size: 0.85rem;
}
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip[aria-pressed="true"] { color: var(--on-red); background: var(--red); border-color: var(--red); }

.grid { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17.5rem), 1fr)); }
.card {
  position: relative; display: flex; flex-direction: column; gap: 0.7rem; min-width: 0;
  padding: 1.1rem; border-radius: 1rem; background: var(--surface); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  transition: border-color 0.18s, box-shadow 0.18s, translate 0.18s;
}
.card:hover { border-color: var(--red); box-shadow: var(--glow); translate: 0 -2px; }
.card-top { display: flex; align-items: center; gap: 0.75rem; }
.mono-tile {
  flex: 0 0 auto; width: 2.7rem; height: 2.7rem; border-radius: 0.7rem; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--red-ink);
  background: var(--red-soft); border: 1px solid color-mix(in srgb, var(--red) 45%, transparent);
}
.card h3 { margin: 0; font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; letter-spacing: 0.03em; overflow-wrap: anywhere; }
.cat { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; color: var(--muted); font-size: 0.92rem; }
.note { font-size: 0.8rem; color: var(--red-ink); border-left: 2px solid var(--red); padding-left: 0.6rem; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: auto; padding-top: 0.3rem; }
.open {
  display: inline-flex; align-items: center; gap: 0.4rem; height: 2.3rem; padding: 0 0.9rem; border-radius: 0.6rem; text-decoration: none;
  font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase;
  background: var(--red); color: var(--on-red);
}
.open:hover { box-shadow: var(--glow); }
.heart {
  margin-left: auto; width: 2.3rem; height: 2.3rem; display: grid; place-items: center; border-radius: 0.6rem;
  border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
}
.heart:hover { color: var(--red-ink); border-color: var(--red); }
.heart[aria-pressed="true"] { color: var(--red); border-color: var(--red); background: var(--red-soft); }
.heart[aria-pressed="true"] svg { fill: currentColor; filter: drop-shadow(0 0 5px var(--red)); }
.icon-btn {
  height: 2.3rem; padding: 0 0.8rem; border-radius: 0.6rem; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: 0.85rem;
}
.icon-btn:hover { color: var(--fg); border-color: var(--muted); }

/* Prompts */
.prompt-list { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 24rem), 1fr)); }
.prompt-text {
  margin: 0; padding: 0.8rem 0.9rem; border-radius: 0.7rem; background: color-mix(in srgb, var(--bg) 70%, transparent); border: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg);
  max-height: 11rem; overflow: auto;
}
.copy { background: var(--red); color: var(--on-red); border: 0; height: 2.3rem; padding: 0 1rem; border-radius: 0.6rem; cursor: pointer; font-family: var(--font-display); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; font-size: 0.85rem; }
.copy:hover { box-shadow: var(--glow); }

/* Empty + settings */
.empty { padding: 2.2rem 1.2rem; border: 1px dashed var(--line); border-radius: 1rem; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 1.15rem; margin-bottom: 0.3rem; }
.empty .open { margin-top: 0.9rem; }
.panel { padding: 1.2rem; border-radius: 1rem; background: var(--surface); border: 1px solid var(--line); margin-bottom: 1rem; }
.form { display: grid; gap: 0.8rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); margin-top: 0.9rem; }
.field { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.field input, .field select {
  height: 2.6rem; padding: 0 0.8rem; min-width: 0; border-radius: 0.6rem; border: 1px solid var(--line); background: var(--surface); width: 100%;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--red); box-shadow: var(--glow); }
.row-list { display: grid; gap: 0.5rem; margin-top: 0.9rem; }
.row { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.8rem; border: 1px solid var(--line); border-radius: 0.7rem; min-width: 0; }
.row span { min-width: 0; overflow-wrap: anywhere; }
.row .icon-btn { margin-left: auto; flex: 0 0 auto; }
.muted { color: var(--muted); }

#toast {
  position: fixed; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); translate: -50% 1rem; opacity: 0; pointer-events: none;
  background: var(--fg); color: var(--bg); padding: 0.6rem 1rem; border-radius: 0.7rem; font-size: 0.88rem; transition: opacity 0.2s, translate 0.2s; max-width: calc(100% - 32px); z-index: 40;
}
#toast.show { opacity: 1; translate: -50% 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  var KEY_FAV = "legitimos.favs.v1";

  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  var favs = new Set(load(KEY_FAV, []));
  var custom = load(KEY_CUSTOM, []);

  function tools() { return BASE_TOOLS.concat(custom); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }

  var toastTimer;
  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $toast.classList.remove("show"); }, 1800);
  }

  function score(t, tokens) {
    var name = norm(t.name), cat = norm(t.cat), kw = norm(t.kw || ""), desc = norm(t.desc);
    var total = 0;
    for (var i = 0; i < tokens.length; i++) {
      var k = tokens[i], s = 0;
      if (name.indexOf(k) > -1) s += 5;
      if (cat.indexOf(k) > -1) s += 3;
      if (kw.indexOf(k) > -1) s += 3;
      if (desc.indexOf(k) > -1) s += 1;
      if (!s) return 0;
      total += s;
    }
    return total;
  }
  function searchTools(list) {
    var tokens = norm(state.q).split(/\s+/).filter(Boolean);
    if (!tokens.length) return list;
    return list
      .map(function (t) { return { t: t, s: score(t, tokens) }; })
      .filter(function (x) { return x.s > 0; })
      .sort(function (a, b) { return b.s - a.s; })
      .map(function (x) { return x.t; });
  }

  var HEART = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.6-9.3-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg>';

  function cardHTML(t) {
    var on = favs.has(t.id);
    return '<article class="card">' +
      '<div class="card-top"><div class="mono-tile" aria-hidden="true">' + iconFor(t) + '</div>' +
      '<div style="min-width:0"><h3>' + esc(t.name) + '</h3><div class="cat">' + esc(t.cat) + '</div></div></div>' +
      '<p>' + esc(t.desc) + '</p>' +
      (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '') +
      '<div class="card-foot">' +
      '<a class="open" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer">Abrir site <span aria-hidden="true">↗</span></a>' +
      '<button class="heart" type="button" data-fav="' + esc(t.id) + '" aria-pressed="' + on + '" aria-label="' + (on ? "Remover " : "Adicionar ") + esc(t.name) + (on ? " dos favoritos" : " aos favoritos") + '">' + HEART + '</button>' +
      '</div></article>';
  }

  function noResultsHTML() {
    var ask = "https://chatgpt.com/?q=" + encodeURIComponent("Qual site ou ferramenta online serve para: " + state.q);
    return '<div class="empty"><strong>Nada encontrado para “' + esc(state.q) + '”</strong>' +
      'Tente outra palavra ou pergunte a uma IA qual ferramenta resolve isso.' +
      '<br><a class="open" href="' + esc(ask) + '" target="_blank" rel="noopener noreferrer">Perguntar ao ChatGPT <span aria-hidden="true">↗</span></a></div>';
  }

  function renderHome() {
    var all = tools();
    var cats = ["Todas"].concat(CATS.filter(function (c) { return all.some(function (t) { return t.cat === c; }); }));
    if (cats.indexOf(state.cat) < 0) state.cat = "Todas";
    var list = searchTools(all).filter(function (t) { return state.cat === "Todas" || t.cat === state.cat; });
    var h = '<div class="head"><div class="hero"><img class="hero-logo" src="' + LOGO + '" alt="" width="112" height="112"><div><h1>Todas as suas ferramentas, <em>num só lugar</em></h1>' +
      '<p class="sub">Pesquise pelo nome do site ou pelo que você precisa fazer.</p></div></div>' +
      '<div class="meta">' + list.length + ' de ' + all.length + ' ferramentas</div></div>';
    h += '<div class="chips" role="group" aria-label="Categorias">' + cats.map(function (c) {
      return '<button class="chip" type="button" data-cat="' + esc(c) + '" aria-pressed="' + (c === state.cat) + '">' + esc(c) + '</button>';
    }).join("") + '</div>';
    if (!list.length) h += state.q ? noResultsHTML() : '<div class="empty"><strong>Nenhuma ferramenta nesta categoria</strong>Adicione sites em Configurações.</div>';
    else h += '<div class="grid">' + list.map(cardHTML).join("") + '</div>';
    return h;
  }

  function renderFavs() {
    var list = searchTools(tools().filter(function (t) { return favs.has(t.id); }));
    var h = '<div class="head"><div><h1>Seus <em>favoritos</em></h1><p class="sub">Os sites que você marcou com o coração.</p></div>' +
      '<div class="meta">' + list.length + ' salvos</div></div>';
    if (!list.length) {
      h += favs.size && state.q ? noResultsHTML() :
        '<div class="empty"><strong>Nenhum favorito ainda</strong>Toque no coração de uma ferramenta na página Início para guardá-la aqui.</div>';
    } else h += '<div class="grid">' + list.map(cardHTML).join("") + '</div>';
    return h;
  }

  function renderPrompts() {
    var pcats = ["Todos"].concat(PROMPTS.reduce(function (a, p) { if (a.indexOf(p.cat) < 0) a.push(p.cat); return a; }, []));
    var tokens = norm(state.q).split(/\s+/).filter(Boolean);
    var list = PROMPTS.filter(function (p) {
      if (state.pcat !== "Todos" && p.cat !== state.pcat) return false;
      var hay = norm(p.title + " " + p.cat + " " + p.text);
      return tokens.every(function (k) { return hay.indexOf(k) > -1; });
    });
    var h = '<div class="head"><div><h1>Biblioteca de <em>prompts</em></h1><p class="sub">Modelos prontos para usar nas ferramentas de IA. Troque o que está entre colchetes pelo seu caso.</p></div>' +
      '<div class="meta">' + list.length + ' prompts</div></div>';
    h += '<div class="chips" role="group" aria-label="Categorias de prompts">' + pcats.map(function (c) {
      return '<button class="chip" type="button" data-pcat="' + esc(c) + '" aria-pressed="' + (c === state.pcat) + '">' + esc(c) + '</button>';
    }).join("") + '</div>';
    if (!list.length) h += '<div class="empty"><strong>Nenhum prompt encontrado</strong>Tente outra palavra.</div>';
    else h += '<div class="prompt-list">' + list.map(function (p) {
      return '<article class="card"><div><div class="cat">' + esc(p.cat) + '</div><h3>' + esc(p.title) + '</h3></div>' +
        '<pre class="prompt-text">' + esc(p.text) + '</pre>' +
        '<div class="card-foot"><button class="copy" type="button" data-copy="' + esc(p.id) + '">Copiar</button></div></article>';
    }).join("") + '</div>';
    return h;
  }

  function renderConfig() {
    var h = '<div class="head"><div><h1><em>Configurações</em></h1><p class="sub">Adicione novos sites ao catálogo e gerencie o que está salvo neste navegador.</p></div></div>';
    h += '<section class="panel"><h2>Adicionar site</h2>' +
      '<form class="form" id="addForm" novalidate>' +
      '<div class="field"><label for="fName">Nome</label><input id="fName" type="text" placeholder="Ex.: Remove.bg" required></div>' +
      '<div class="field"><label for="fUrl">Endereço</label><input id="fUrl" type="text" inputmode="url" placeholder="remove.bg" required></div>' +
      '<div class="field"><label for="fCat">Categoria</label><select id="fCat">' + CATS.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join("") + '</select></div>' +
      '<div class="field"><label for="fDesc">Para que serve</label><input id="fDesc" type="text" placeholder="Remove o fundo de fotos"></div>' +
      '<div class="field wide"><button class="copy" type="submit" style="width:max-content">Adicionar ao catálogo</button></div>' +
      '</form>';
    if (custom.length) {
      h += '<div class="row-list">' + custom.map(function (t) {
        return '<div class="row"><span><strong>' + esc(t.name) + '</strong> <span class="muted">' + esc(t.url) + '</span></span>' +
          '<button class="icon-btn" type="button" data-del="' + esc(t.id) + '">Remover</button></div>';
      }).join("") + '</div>';
    }
    h += '</section>';
    h += '<section class="panel"><h2>Dados salvos</h2>' +
      '<p class="muted" style="margin:0.5rem 0 0.9rem">Favoritos e sites adicionados ficam guardados só neste navegador.</p>' +
      '<button class="icon-btn" type="button" id="clearFavs">Limpar todos os favoritos</button></section>';
    return h;
  }

  function render() {
    var v = state.view;
    $box.hidden = v === "config";
    $q.placeholder = v === "prompts" ? "Buscar um prompt" : "Busque por nome ou função, ex.: editar PDF";
    $view.innerHTML = v === "home" ? renderHome() : v === "favs" ? renderFavs() : v === "prompts" ? renderPrompts() : renderConfig();
    $count.textContent = favs.size;
    $clear.hidden = !state.q;
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.view === v)); });
  }

  function copyText(text) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? "Prompt copiado" : "Não foi possível copiar. Selecione o texto e copie.");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("Prompt copiado"); }, fallback);
    } else fallback();
  }

  document.querySelector(".tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".tab"); if (!b) return;
    state.view = b.dataset.view; render();
  });
  $q.addEventListener("input", function () {
    state.q = $q.value;
    var pos = $q.selectionStart;
    render();
    $q.focus();
    try { $q.setSelectionRange(pos, pos); } catch (e) {}
  });
  $clear.addEventListener("click", function () { state.q = ""; $q.value = ""; render(); $q.focus(); });

  $view.addEventListener("click", function (e) {
    var t = e.target;
    var fav = t.closest("[data-fav]");
    if (fav) {
      var id = fav.dataset.fav;
      if (favs.has(id)) { favs.delete(id); toast("Removido dos favoritos"); } else { favs.add(id); toast("Adicionado aos favoritos"); }
      save(KEY_FAV, Array.from(favs));
      render(); return;
    }
    var cat = t.closest("[data-cat]"); if (cat) { state.cat = cat.dataset.cat; render(); return; }
    var pcat = t.closest("[data-pcat]"); if (pcat) { state.pcat = pcat.dataset.pcat; render(); return; }
    var cp = t.closest("[data-copy]");
    if (cp) { var p = PROMPTS.filter(function (x) { return x.id === cp.dataset.copy; })[0]; if (p) copyText(p.text); return; }
    var del = t.closest("[data-del]");
    if (del) {
      var did = del.dataset.del;
      custom = custom.filter(function (x) { return x.id !== did; });
      favs.delete(did);
      save(KEY_CUSTOM, custom); save(KEY_FAV, Array.from(favs));
      toast("Site removido"); render(); return;
    }
    if (t.closest("#clearFavs")) { favs.clear(); save(KEY_FAV, []); toast("Favoritos limpos"); render(); }
  });

  $view.addEventListener("submit", function (e) {
    if (e.target.id !== "addForm") return;
    e.preventDefault();
    var name = document.getElementById("fName").value.trim();
    var url = document.getElementById("fUrl").value.trim();
    if (!name || !url) { toast("Preencha o nome e o endereço"); return; }
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    var ok = false;
    try { var u = new URL(url); ok = (u.protocol === "http:" || u.protocol === "https:") && u.hostname.indexOf(".") > 0; } catch (err) {}
    if (!ok) { toast("Endereço inválido. Exemplo: remove.bg"); return; }
    var cat = document.getElementById("fCat").value;
    var desc = document.getElementById("fDesc").value.trim() || "Site adicionado por você.";
    custom.push({ id: "c-" + Date.now(), name: name, url: url, cat: cat, desc: desc, kw: "" });
    save(KEY_CUSTOM, custom);
    toast(name + " adicionado"); render();
  });

  render();
})();
</script>
</body>
</html>
