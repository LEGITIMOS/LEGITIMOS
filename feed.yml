name: Atualizar feed

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - index.html
      - feed-sources.json
      - promos.json
      - build-feed.mjs
      - .github/workflows/feed.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-feed.mjs
      - name: Salvar feed.json
        run: |
          git config user.name "legitimos-bot"
          git config user.email "legitimos-bot@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || (git commit -m "Atualiza feed" && git push)
